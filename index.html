<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #02030a;
      font-family: Arial, sans-serif;
    }

    .game-shell {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 24px;
    }

    .controls-panel {
      width: 220px;
      padding: 18px 16px;
      border: 1px solid #30395e;
      border-radius: 12px;
      background: rgba(15, 18, 35, 0.92);
      box-shadow: 0 0 18px rgba(75, 110, 255, 0.12);
      color: #dfe7ff;
    }

    .controls-panel h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #89c2ff;
    }

    .controls-panel ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.7;
      font-size: 0.96rem;
    }

    .controls-panel li strong {
      color: #fff;
    }

    canvas {
      display: block;
      background: #030611;
      border: 1px solid #30395e;
    }

    @media (max-width: 1094px) {
      body {
        display: block;
        overflow-x: auto;
      }

      .game-shell {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <aside class="controls-panel" aria-label="Game controls">
      <h2>Controls</h2>
      <ul>
        <li><strong>Move:</strong> Left / Right Arrow Keys</li>
        <li><strong>Shoot:</strong> Space Bar</li>
        <li><strong>Restart:</strong> Press R</li>
      </ul>
    </aside>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const stars = Array.from({ length: 100 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 0.7 + Math.random() * 1.5,
      brightness: 0.25 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.7 + Math.random() * 1.3
    }));
    const nebulaGradients = [
      (() => {
        const gradient = ctx.createRadialGradient(220, 180, 0, 220, 180, 360);
        gradient.addColorStop(0, 'rgba(75, 49, 145, 0.20)');
        gradient.addColorStop(1, 'rgba(36, 27, 86, 0)');
        return gradient;
      })(),
      (() => {
        const gradient = ctx.createRadialGradient(650, 400, 0, 650, 400, 320);
        gradient.addColorStop(0, 'rgba(20, 86, 118, 0.14)');
        gradient.addColorStop(1, 'rgba(12, 47, 79, 0)');
        return gradient;
      })()
    ];

    const player = {
      width: 70,
      height: 24,
      x: canvas.width / 2 - 35,
      y: canvas.height - 40,
      speed: 360,
      lives: 3,
      score: 0
    };

    const keys = {
      left: false,
      right: false,
      shoot: false
    };

    const invaderPatterns = {
      squid: [
        '00111100',
        '01111110',
        '11111111',
        '11011011',
        '11111111',
        '01100110',
        '01011010',
        '00100100'
      ],
      crab: [
        '01111110',
        '11111111',
        '11111111',
        '10111101',
        '11111111',
        '01100110',
        '01011010',
        '00100100'
      ],
      octopus: [
        '01111110',
        '11111111',
        '11011011',
        '11111111',
        '01111110',
        '01011010',
        '00100100',
        '01100110'
      ]
    };

    const invaders = [];
    const playerBullets = [];
    const enemyBullets = [];
    const shields = [];
    const invaderSpeed = 45;
    const invaderDropDistance = 18;
    const invaderPauseDuration = 1 / 3;
    const playerBulletSpeed = 480;
    const enemyBulletSpeed = 240;
    const playerShotCooldownDuration = 0.3;
    const playerInvulnerabilityDuration = 1.5;
    const enemyBulletLimit = 3;
    const invaderPoints = {
      squid: 30,
      crab: 20,
      octopus: 10
    };
    let invaderDirection = 1;
    let invaderPauseRemaining = 0;
    let playerShotCooldown = 0;
    let enemyShotCooldown = randomEnemyShotDelay();
    let playerInvulnerability = 0;
    let gameState = 'playing';
    let lastTimestamp = 0;

    function randomEnemyShotDelay() {
      return 0.75 + Math.random() * 1.25;
    }

    function resetGame() {
      player.x = canvas.width / 2 - player.width / 2;
      player.lives = 3;
      player.score = 0;
      keys.left = false;
      keys.right = false;
      keys.shoot = false;
      playerBullets.length = 0;
      enemyBullets.length = 0;
      invaders.length = 0;
      shields.length = 0;
      invaderDirection = 1;
      invaderPauseRemaining = 0;
      playerShotCooldown = 0;
      enemyShotCooldown = randomEnemyShotDelay();
      playerInvulnerability = 0;
      gameState = 'playing';
      createInvaderFormation();
      createShields();
    }

    function createInvaderFormation() {
      const rows = 5;
      const cols = 11;
      const invaderWidth = 24;
      const invaderHeight = 24;
      const spacingX = 18;
      const spacingY = 14;
      const formationWidth = cols * invaderWidth + (cols - 1) * spacingX;
      const startX = (canvas.width - formationWidth) / 2;
      const startY = 60;

      const rowTypes = ['squid', 'crab', 'crab', 'octopus', 'octopus'];
      const rowColors = ['#ff4d4d', '#4dd9ff', '#4dd9ff', '#5cff7a', '#5cff7a'];

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          invaders.push({
            x: startX + col * (invaderWidth + spacingX),
            y: startY + row * (invaderHeight + spacingY),
            width: invaderWidth,
            height: invaderHeight,
            row,
            col,
            type: rowTypes[row],
            color: rowColors[row],
            alive: true
          });
        }
      }
    }

    function createShields() {
      const pattern = [
        '00111100',
        '01111110',
        '11111111',
        '11111111',
        '11100111',
        '11000011'
      ];
      const cellSize = 8;
      const shieldWidth = pattern[0].length * cellSize;
      const shieldCount = 4;
      const shieldY = canvas.height - 150;

      for (let shieldIndex = 0; shieldIndex < shieldCount; shieldIndex++) {
        const shieldX = canvas.width * (shieldIndex + 1) / (shieldCount + 1) - shieldWidth / 2;

        for (let row = 0; row < pattern.length; row++) {
          for (let col = 0; col < pattern[row].length; col++) {
            if (pattern[row][col] === '1') {
              shields.push({
                x: shieldX + col * cellSize,
                y: shieldY + row * cellSize,
                width: cellSize,
                height: cellSize
              });
            }
          }
        }
      }
    }

    function drawInvader(invader) {
      if (!invader.alive) return;

      const pattern = invaderPatterns[invader.type];
      const pixelSize = 3;

      for (let row = 0; row < pattern.length; row++) {
        for (let col = 0; col < pattern[row].length; col++) {
          if (pattern[row][col] === '1') {
            ctx.fillStyle = invader.color;
            ctx.fillRect(
              invader.x + col * pixelSize,
              invader.y + row * pixelSize,
              pixelSize,
              pixelSize
            );
          }
        }
      }
    }

    document.addEventListener('keydown', (event) => {
      if (event.code === 'KeyR' && gameState !== 'playing') {
        resetGame();
        event.preventDefault();
        return;
      }

      if (event.key === 'ArrowLeft') {
        keys.left = true;
        event.preventDefault();
      }

      if (event.key === 'ArrowRight') {
        keys.right = true;
        event.preventDefault();
      }

      if (event.code === 'Space') {
        if (gameState === 'playing') {
          keys.shoot = true;
        }
        event.preventDefault();
      }
    });

    document.addEventListener('keyup', (event) => {
      if (event.key === 'ArrowLeft') {
        keys.left = false;
      }

      if (event.key === 'ArrowRight') {
        keys.right = false;
      }

      if (event.code === 'Space') {
        keys.shoot = false;
        event.preventDefault();
      }
    });

    window.addEventListener('blur', () => {
      keys.left = false;
      keys.right = false;
      keys.shoot = false;
    });

    function update(deltaTime) {
      if (gameState !== 'playing') return;

      if (keys.left) {
        player.x -= player.speed * deltaTime;
      }

      if (keys.right) {
        player.x += player.speed * deltaTime;
      }

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      updatePlayerShooting(deltaTime);
      updateInvaders(deltaTime);

      if (invaders.some((invader) => invader.y + invader.height >= player.y)) {
        gameState = 'gameOver';
        return;
      }

      updateEnemyShooting(deltaTime);
      updateBullets(deltaTime);
      checkCollisions(deltaTime);

      if (player.lives <= 0) {
        gameState = 'gameOver';
      } else if (invaders.length === 0) {
        gameState = 'won';
      }
    }

    function updatePlayerShooting(deltaTime) {
      if (playerShotCooldown > 0) {
        playerShotCooldown = Math.max(0, playerShotCooldown - deltaTime);
      }

      if (keys.shoot && playerShotCooldown === 0) {
        playerBullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y,
          width: 4,
          height: 12
        });
        playerShotCooldown = playerShotCooldownDuration;
      }
    }

    function updateEnemyShooting(deltaTime) {
      if (invaders.length === 0) return;

      enemyShotCooldown -= deltaTime;
      if (enemyShotCooldown > 0) return;

      if (enemyBullets.length < enemyBulletLimit) {
        const lowestByColumn = new Map();
        for (const invader of invaders) {
          const lowest = lowestByColumn.get(invader.col);
          if (!lowest || invader.y > lowest.y) {
            lowestByColumn.set(invader.col, invader);
          }
        }

        const shooters = Array.from(lowestByColumn.values());
        const shooter = shooters[Math.floor(Math.random() * shooters.length)];
        enemyBullets.push({
          x: shooter.x + shooter.width / 2 - 2,
          y: shooter.y + shooter.height,
          width: 4,
          height: 12
        });
      }

      enemyShotCooldown = randomEnemyShotDelay();
    }

    function updateBullets(deltaTime) {
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        playerBullets[i].y -= playerBulletSpeed * deltaTime;
        if (playerBullets[i].y + playerBullets[i].height < 0) {
          playerBullets.splice(i, 1);
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].y += enemyBulletSpeed * deltaTime;
        if (enemyBullets[i].y > canvas.height) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    function rectanglesOverlap(first, second) {
      return first.x < second.x + second.width &&
        first.x + first.width > second.x &&
        first.y < second.y + second.height &&
        first.y + first.height > second.y;
    }

    function checkCollisions(deltaTime) {
      for (let bulletIndex = playerBullets.length - 1; bulletIndex >= 0; bulletIndex--) {
        const bullet = playerBullets[bulletIndex];
        let hitShield = false;

        for (let shieldIndex = shields.length - 1; shieldIndex >= 0; shieldIndex--) {
          if (rectanglesOverlap(bullet, shields[shieldIndex])) {
            playerBullets.splice(bulletIndex, 1);
            shields.splice(shieldIndex, 1);
            hitShield = true;
            break;
          }
        }

        if (hitShield) continue;

        for (let invaderIndex = invaders.length - 1; invaderIndex >= 0; invaderIndex--) {
          const invader = invaders[invaderIndex];
          if (rectanglesOverlap(bullet, invader)) {
            playerBullets.splice(bulletIndex, 1);
            invaders.splice(invaderIndex, 1);
            player.score += invaderPoints[invader.type];
            break;
          }
        }
      }

      if (playerInvulnerability > 0) {
        playerInvulnerability = Math.max(0, playerInvulnerability - deltaTime);
      }

      for (let bulletIndex = enemyBullets.length - 1; bulletIndex >= 0; bulletIndex--) {
        const bullet = enemyBullets[bulletIndex];
        let hitShield = false;

        for (let shieldIndex = shields.length - 1; shieldIndex >= 0; shieldIndex--) {
          if (rectanglesOverlap(bullet, shields[shieldIndex])) {
            enemyBullets.splice(bulletIndex, 1);
            shields.splice(shieldIndex, 1);
            hitShield = true;
            break;
          }
        }

        if (hitShield) continue;

        if (rectanglesOverlap(bullet, player)) {
          enemyBullets.splice(bulletIndex, 1);

          if (playerInvulnerability === 0) {
            player.lives--;
            playerInvulnerability = playerInvulnerabilityDuration;
            player.x = canvas.width / 2 - player.width / 2;
          }
        }
      }
    }

    function updateInvaders(deltaTime) {
      if (invaders.length === 0) return;

      if (invaderPauseRemaining > 0) {
        invaderPauseRemaining = Math.max(0, invaderPauseRemaining - deltaTime);

        if (invaderPauseRemaining === 0) {
          for (const invader of invaders) {
            invader.y += invaderDropDistance;
          }
          invaderDirection *= -1;
        }

        return;
      }

      const leftEdge = Math.min(...invaders.map((invader) => invader.x));
      const rightEdge = Math.max(...invaders.map((invader) => invader.x + invader.width));
      const horizontalMovement = invaderSpeed * invaderDirection * deltaTime;
      const nextLeftEdge = leftEdge + horizontalMovement;
      const nextRightEdge = rightEdge + horizontalMovement;

      if (nextLeftEdge < 0 || nextRightEdge > canvas.width) {
        const edgeCorrection = invaderDirection > 0
          ? canvas.width - rightEdge
          : -leftEdge;

        for (const invader of invaders) {
          invader.x += edgeCorrection;
        }

        invaderPauseRemaining = invaderPauseDuration;
        return;
      }

      for (const invader of invaders) {
        invader.x += horizontalMovement;
      }
    }

    function drawPlayer() {
      if (playerInvulnerability > 0 && Math.floor(playerInvulnerability * 8) % 2 === 1) {
        return;
      }

      ctx.fillStyle = '#fff';
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawShields() {
      ctx.fillStyle = '#5cff7a';
      for (const cell of shields) {
        ctx.fillRect(cell.x, cell.y, cell.width, cell.height);
      }
    }

    function drawBullets() {
      ctx.fillStyle = '#fff';
      for (const bullet of playerBullets) {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      }

      ctx.fillStyle = '#ff6666';
      for (const bullet of enemyBullets) {
        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      }
    }

    function drawInvaders() {
      for (const invader of invaders) {
        drawInvader(invader);
      }
    }

    function drawHud() {
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('LIVES: ' + player.lives, 20, 30);
      ctx.textAlign = 'right';
      ctx.fillText('SCORE: ' + player.score, canvas.width - 20, 30);

      if (gameState !== 'playing') {
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px Arial';
        ctx.fillText(gameState === 'won' ? 'YOU WIN' : 'GAME OVER', canvas.width / 2, canvas.height / 2);
        ctx.font = '20px Arial';
        ctx.fillText('Press R to play again', canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    function drawBackground(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const baseGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      baseGradient.addColorStop(0, '#050817');
      baseGradient.addColorStop(0.55, '#08091b');
      baseGradient.addColorStop(1, '#030711');
      ctx.fillStyle = baseGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const gradient of nebulaGradients) {
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      for (const star of stars) {
        const twinkle = 0.72 + 0.28 * Math.sin(timestamp * 0.001 * star.twinkleSpeed + star.phase);
        ctx.fillStyle = 'rgba(218, 228, 255, ' + star.brightness * twinkle + ')';
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
    }

    function draw(timestamp) {
      drawBackground(timestamp);
      drawInvaders();
      drawShields();
      drawBullets();
      drawPlayer();
      drawHud();
    }

    function gameLoop(timestamp) {
      const deltaTime = lastTimestamp === 0
        ? 1 / 60
        : Math.min((timestamp - lastTimestamp) / 1000, 1 / 30);
      lastTimestamp = timestamp;

      update(deltaTime);
      draw(timestamp);
      requestAnimationFrame(gameLoop);
    }

    createInvaderFormation();
    createShields();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
